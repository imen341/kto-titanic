name: CI Training

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.13

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --group training --group dev

      - name: Run tests
        run: |
          uv run pytest tests/ci tests/training
